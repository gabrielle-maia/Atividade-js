<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Atividade 1 javascript</title>
</head>
<body>
  <script>
  const num = Math.floor(Math.random() * 20) + 1;
let palpite;

do {
  palpite = parseInt(prompt("Adivinhe o número entre 1 e 20:"));

  if (palpite > num) {
    alert("Muito alto! Tente um número menor.");
  } else if (palpite < num) {
    alert("Muito baixo! Tente um número maior.");
  } else if (palpite === num) {
    alert("Parabéns! Você acertou o número secreto.");
  } else {

  }
} while (palpite !== num);
  </script>
</body>
</html>
